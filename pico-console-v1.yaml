      inverted: true
  - platform: gpio
    name: "S1_L"
    pin:
      pca9554: pca9554_1
      number: 2
      inverted: true
  - platform: gpio
    name: "S1_R"
    pin:
      pca9554: pca9554_1
      number: 3
      inverted: true
  - platform: gpio
    name: "BTN_R"
    pin:
      pca9554: pca9554_1
      number: 4
      inverted: true
  - platform: gpio
    name: "BTN_L"
    pin:
      pca9554: pca9554_1
      number: 5
      inverted: true
  - platform: gpio
    name: "BTN_D"
    pin:
      pca9554: pca9554_1
      number: 6
      inverted: true
  - platform: gpio
    name: "BTN_U"
    pin:
      pca9554: pca9554_1
      number: 7
      inverted: true
  - platform: gpio
    name: "S2_U"
    pin:
      pca9554: pca9554_2
      number: 0
      inverted: true
  - platform: gpio
    name: "S2_D"
    pin:
      pca9554: pca9554_2
      number: 1
      inverted: true
  - platform: gpio
    name: "S2_L"
    pin:
      pca9554: pca9554_2
      number: 2
      inverted: true
  - platform: gpio
    name: "S2_R"
    pin:
      pca9554: pca9554_2
      number: 3
      inverted: true
  - platform: gpio
    name: "BTN_Y"
    pin:
      pca9554: pca9554_2
      number: 4
      inverted: true
  - platform: gpio
    name: "BTN_X"
    pin:
      pca9554: pca9554_2
      number: 5
      inverted: true
  - platform: gpio
    name: "BTN_B"
    pin:
      pca9554: pca9554_2
      number: 6
      inverted: true
  - platform: gpio
    name: "BTN_A"
    pin:
      pca9554: pca9554_2
      number: 7
      inverted: true

  - platform: gpio
    name: "S2_C"
    pin:
      pca9554: pca9554_3
      number: 0
      inverted: true
  - platform: gpio
