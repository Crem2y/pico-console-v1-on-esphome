  - platform: gpio
    name: "S1_C"
    pin:
      pca9554: pca9554_3
      number: 7
      inverted: true

display:
  - platform: mipi_spi
    id: lcd
    model: ILI9341
    rotation: 270
    data_rate: 10MHz
    cs_pin: GPIO15
    dc_pin: GPIO14
    reset_pin: GPIO13
    invert_colors: false
#    show_test_card: true 
    lambda: |-
      it.fill(Color(0, 0, 0));
    
      it.print(
        10, 10,
        id(console_font),
        Color(255, 255, 255),
        id(console_message).state.c_str()
      );

sensor:
  - platform: adc
    name: Battery Voltage
    id: sensor_adc_1
    pin: GPIO28
    filters:
      - multiply: 2.0
    unit_of_measurement: "V"
    accuracy_decimals: 2

  - platform: copy
    source_id: sensor_adc_1
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.00 -> 0
            - 3.30 -> 5
            - 3.50 -> 10
            - 3.60 -> 20
            - 3.70 -> 40
            - 3.80 -> 60
            - 3.90 -> 75
            - 4.00 -> 85
            - 4.10 -> 95
            - 4.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100
