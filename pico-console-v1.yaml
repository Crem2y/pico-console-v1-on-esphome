      inverted: true
  - platform: gpio
    name: "BTN_ZR"
    pin:
      pca9554: pca9554_3
      number: 3
      inverted: true
  - platform: gpio
    name: "BTN_ZL"
    pin:
      pca9554: pca9554_3
      number: 4
      inverted: true
  - platform: gpio
    name: "BTN_SL"
    pin:
      pca9554: pca9554_3
